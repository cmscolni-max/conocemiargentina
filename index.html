
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
  <title>Recorre Argentina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {}
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ra-celeste-50: #eef8ff;
      --ra-celeste-100: #d9efff;
      --ra-celeste-200: #bce3ff;
      --ra-celeste-300: #94d2ff;
      --ra-celeste-500: #2b9de7;
      --ra-celeste-700: #0f6fb2;
      --ra-celeste-800: #0a5a92;
      --ra-sol-300: #ffd46b;
      --ra-sol-500: #ffbf2f;
      --ra-ink-900: #112236;
    }
    body {
      font-family: 'Manrope', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background: #f5f5f4;
      color: var(--ra-ink-900);
    }
    h1, h2, h3, .font-black {
      font-family: 'Sora', 'Manrope', sans-serif;
      letter-spacing: -0.01em;
    }
    html.dark body {
      background: #0c0a09;
    }
    html:not(.dark) .bg-emerald-800 {
      background-color: var(--ra-celeste-800) !important;
    }
    html:not(.dark) .bg-emerald-100 {
      background-color: var(--ra-celeste-100) !important;
    }
    html:not(.dark) .bg-emerald-50 {
      background-color: var(--ra-celeste-50) !important;
    }
    html:not(.dark) .text-emerald-800,
    html:not(.dark) .text-emerald-700,
    html:not(.dark) .text-emerald-600 {
      color: var(--ra-celeste-700) !important;
    }
    html:not(.dark) .text-emerald-400,
    html:not(.dark) .text-emerald-300,
    html:not(.dark) .text-emerald-200 {
      color: var(--ra-celeste-200) !important;
    }
    html:not(.dark) .border-emerald-100 {
      border-color: var(--ra-celeste-100) !important;
    }
    html:not(.dark) .border-emerald-300\/30 {
      border-color: rgba(188, 227, 255, 0.35) !important;
    }
    html:not(.dark) .bg-emerald-300\/10 {
      background-color: rgba(188, 227, 255, 0.12) !important;
    }
    html:not(.dark) .shadow-emerald-900\/20 {
      --tw-shadow-color: rgba(10, 90, 146, 0.3) !important;
    }
    html:not(.dark) .focus\:ring-emerald-500\/20:focus {
      --tw-ring-color: rgba(43, 157, 231, 0.26) !important;
    }
    html:not(.dark) .bg-stone-50 {
      background-color: #f5f5f4 !important;
    }
    html:not(.dark) .text-stone-950 {
      color: #102132 !important;
    }
    .rounded-3xl,
    .rounded-\[2rem\],
    .rounded-\[2\.5rem\] {
      box-shadow: 0 20px 45px rgba(18, 44, 71, 0.09);
    }
    input:not([type="checkbox"]):not([type="radio"]),
    textarea,
    select {
      font-size: 16px !important;
      line-height: 1.35;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
      width: 100%;
    }
    select {
      appearance: none;
      -webkit-appearance: none;
    }
    input[type="date"] {
      min-height: 52px;
      height: 52px;
      padding: 0 12px;
      appearance: none;
      -webkit-appearance: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    input[type="date"]::-webkit-datetime-edit,
    input[type="date"]::-webkit-date-and-time-value {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      margin: 0;
    }
    .form-two-col {
      display: grid;
      align-items: start;
      grid-template-columns: repeat(2, calc((100% - 0.75rem) / 2));
      gap: 0.75rem;
    }
    .form-two-col > * {
      min-width: 0;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @media (max-width: 768px) {
      [class*="text-[8px]"] { font-size: 10px !important; }
      [class*="text-[9px]"] { font-size: 11px !important; }
      [class*="text-[10px]"] { font-size: 12px !important; }
      [class*="text-[11px]"] { font-size: 13px !important; }
      .text-xs { font-size: 0.875rem !important; }
    }
  </style>
</head>
<body class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-50 transition-colors duration-300">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
